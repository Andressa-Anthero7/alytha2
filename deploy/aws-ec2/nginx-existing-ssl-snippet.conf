# Inserir dentro do server { listen 443 ssl ... } existente de plataforma.alytha.agr.br.
# Mantem o certificado atual e substitui a pagina de "aguarde inauguracao" pela aplicacao.

client_max_body_size 20M;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

root /srv/alytha/frontend/dist;
index index.html;

location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /share/ {
    proxy_pass http://127.0.0.1:8000/share/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8000/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /static/ {
    alias /srv/alytha/backend/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location / {
    try_files $uri $uri/ /index.html;
}
