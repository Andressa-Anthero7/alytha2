server {
    listen 80;
    listen [::]:80;
    server_name plataforma.alytha.agr.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plataforma.alytha.agr.br;

    ssl_certificate /etc/letsencrypt/live/plataforma.alytha.agr.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataforma.alytha.agr.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /srv/alytha/frontend/dist;
    index index.html;

    error_page 404 /404.html;

    location = /404.html {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /404.html =404;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /privacidade {
        return 301 /lgpd;
    }

    location = /termos {
        return 301 /termos-de-servico;
    }

    location = /vendergraos {
        return 301 /vendedorgraos;
    }

    location = /vendendorgraos {
        return 301 /vendedorgraos;
    }

    location = /vender {
        return 301 /vendedorgraos;
    }

    location = /comprar {
        return 301 /compradorgraos;
    }

    location = /lp/produtor {
        return 301 /vendedorgraos;
    }

    location = /lp/comprador {
        return 301 /compradorgraos;
    }

    location = /lp/corretor {
        return 301 /corretores;
    }

    location ~ ^/oportunidade/([0-9]+)/?$ {
        return 301 /oportunidades/$1;
    }

    location ~ ^/oportunidades/[0-9]+/?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /share/ {
        proxy_pass http://127.0.0.1:8000/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /srv/alytha/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~ ^/(login|app/login(?:/[^/]+)?|app/cadastro(?:/.*)?|cadastro/?|esqueci-minha-senha|redefinir-senha/[^/]+|dashboard|mesa-operacional|app/admin/backoffice|ofertas/(venda|compra)/nova|perfil(?:/trocar-senha)?|corretor/[^/]+/[^/]+|backoffice|app/cliente|app/tradingdesk/[^/]+|demo(?:/.*)?|erro)/?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
